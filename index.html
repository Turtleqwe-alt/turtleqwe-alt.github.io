<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibeniacha Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p1 id="title">Ibeniacha Translator</p1>
    </header>

    <div id="i-to-e">
        <h1>Ibeniacha To English</h1>
        <input type="text" id="i_input" name="i_input" placeholder="Enter Ibeniacha Word">
        <h2 id="output">Output</h2>
    </div>
    <script>
        const textBox = document.getElementById("i_input")
        const output = document.getElementById("output")

        const dictionary = {
            "was": "What",
            "ja": "Yes",
            "jco": "No",
            "jasc": "Maybe",
            "jasi": "Maybe",
            "zas'": "The",
            "mamusk": "Mother",
            "papusc": "Father",
            "bin'": "And",
            "vi": "So",
            "vajn'": "Either",
            "sovn": "Or",
            "cazs": "Do",
            "cazs'et": "Don't",
            "ya'": "You",
            "tu'o": "I / Me",
            "dvurlet": "Turtle",
            "wofenma": "Dog",
            "miavenma": "Cat",
            "zdeven": "Idea",
            "davir": "Now",
            "dav'": "Now",
            "vbin": "To",
            "v'": "To",
            "dofze": "Easy",
            "dafzen": "Hard",
            "hiall'e": "Hello",
            "janz": "Want",
            "nvet": "But",
            "k'xovi": "Know",
            "sket": "Was",
            "mv'ta": "Too",
            "chet'nab": "That",
            "vet'n": "Are",
            "p'risnov": "Problem"
        }

        textBox.addEventListener("input", function() {
            const word = textBox.value.trim().toLowerCase()

            if(word === "") {
                output.textContent = "Output"
            } else if(dictionary[word]) {
                output.textContent = dictionary[word]
            } else {
                output.textContent = "Unrecognized"
            }
        });
    </script>
</body>
</html>
